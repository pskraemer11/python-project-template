# Test-Gate dieses Repos. Abschnitt 3 der Vorlage
# ~/.agents/references/githooks/ liest diese Werte.
#
# Pfade, deren Aenderung Lint und Tests ausloest. Die Praefixe entscheiden nur,
# OB geprueft wird, nie WAS: die Testmenge bleibt immer vollstaendig.
# .github steht dabei, damit Workflow-Aenderungen den Gate bereits beim Commit
# triggern; pre-push laeuft ohnehin immer.
prefixes=src/ tests/ pyproject.toml requirements-ci.txt .github/ scripts/
# Kein Projekt-venv: der Interpreter kommt aus dem PATH der Git-Bash.
python=
# Ausschluesse und Regelauswahl stehen in pyproject.toml, nicht hier.
# actionlint (winget: rhysd.actionlint) prueft .github/workflows auf
# Ausdrucks- und Kontextfehler, die lokale YAML-Parser nicht sehen.
lint={python} -m ruff check . && {python} -m ruff format --check . && {python} -m pyright && actionlint
test={python} -m pytest -q
